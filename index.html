<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيانة البانل — Panel Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Kufi+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #07070c;
    --card-bg: rgba(18, 19, 28, 0.72);
    --amber: #ffb020;
    --amber-glow: rgba(255, 176, 32, 0.25);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #9ca3af;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background-color: var(--bg-dark);
    font-family: 'Inter', 'Noto Kufi Arabic', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
    color: var(--text-main);
  }

  /* خلفية شبكية هندسية خفيفة */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    z-index: 0;
  }

  /* إضاءة محيطية خلف البطاقة */
  .ambient-glow {
    position: absolute;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
    filter: blur(60px);
    z-index: 0;
    animation: breathe 5s ease-in-out infinite alternate;
  }

  /* البطاقة الرئيسية بتأثير الزجاج */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 660px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-top: 1px solid rgba(255, 176, 32, 0.45);
    border-radius: 24px;
    padding: 44px 36px;
    text-align: center;
    box-shadow: 
      0 25px 50px -12px rgba(0, 0, 0, 0.75),
      0 0 40px rgba(255, 176, 32, 0.08);
    animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* شارة الحالة النابضة في الأعلى */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 176, 32, 0.1);
    border: 1px solid rgba(255, 176, 32, 0.25);
    color: var(--amber);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background-color: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--amber);
    animation: pulse 1.6s infinite;
  }

  /* حاوية الأيقونة */
  .icon-box {
    width: 68px;
    height: 68px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(255, 176, 32, 0.15), rgba(255, 176, 32, 0.03));
    border: 1px solid rgba(255, 176, 32, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--amber);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
  }

  .icon-box svg {
    width: 32px;
    height: 32px;
    animation: slowSpin 12s linear infinite;
  }

  /* النصوص */
  .en-title {
    direction: ltr;
    font-size: 23px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.45;
    letter-spacing: -0.02em;
  }

  .en-sub {
    direction: ltr;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 500;
  }

  /* شريط التحميل المتدرج */
  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    margin: 28px 0;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--amber), #fff5d6, var(--amber), transparent);
    border-radius: 999px;
    animation: slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .ar-title {
    direction: rtl;
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.6;
    background: linear-gradient(135deg, #ffd17a 0%, #ffb020 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .ar-sub {
    direction: rtl;
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 600;
  }

  /* الحركات */
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 176, 32, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 176, 32, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 176, 32, 0); }
  }

  @keyframes slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  @keyframes slowSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes breathe {
    from { opacity: 0.5; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1.1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .card { padding: 32px 22px; }
    .en-title { font-size: 19px; }
    .ar-title { font-size: 20px; }
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="ambient-glow"></div>

  <main class="card">
    <div class="status-pill">
      <span class="pulse-dot"></span>
      <span>System Maintenance</span>
    </div>

    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <h1 class="en-title">The panel is currently undergoing maintenance</h1>
    <p class="en-sub">We are working on improvements. Please check back shortly.</p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <h2 class="ar-title">البانل حاليًا تخضع لبعض الصيانة</h2>
    <p class="ar-sub">نقوم ببعض التحسينات حالياً، الرجاء الانتظار والعودة قريباً</p>
  </main>

</body>
</html>
